<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="register.css" />
    <link rel="stylesheet" href="../navbar/navbar.css" />
    <link rel="shortcut icon" href="../favicon/favicon.ico" type="image/x-icon">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../toast.css" />
    <title>Register</title>
  </head>
  <body>
    <!-- navbar  -->
    <nav class="navbar" style="margin-top: -103px;">
      <div class="containerNav">
        <a href="../index.html" class="logo">Task Management System</a>
        <button class="hamburger" id="hamburger">
          <i class="fas fa-bars"></i>
        </button>
        <div class="nav-links" id="nav-links">
          <a href="../index.html">Home</a>
          <a href="../user_register/register.html">Register</a>
          <a href="../user_login/login.html">Login</a>
          <a href="#logout" id="logout">Logout</a>
        </div>
      </div>
    </nav>

    <!-- body  -->
    <div class="container">
      <div class="header">
        <h1>Register</h1>
      </div>
      <form id="registerForm">
        <input type="text" name="fullname" placeholder="Full Name" required />
        <input type="email" name="email" placeholder="Email Address" required />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />
        <input
          type="password"
          name="confirm_password"
          placeholder="Confirm Password"
          required
        />
        <button type="submit" class="btn">Register</button>
      </form>
      <div class="footer">
        <p>
          Already have an account?
          <a href="../user_login/login.html">Login here</a>
        </p>
      </div>
    </div>

     <!-- toast  -->
     <ul class="notifications"></ul>
     
    <script src="./register.js"></script>
    <script src="../toast.js"></script>
    <script src="../navbar/navbar.js"></script>
  </body>
</html>
